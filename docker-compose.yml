version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"  # Main API port
      - "9001:9001"  # Web Console port
    environment:
      MINIO_ROOT_USER: admin        # Change this!
      MINIO_ROOT_PASSWORD: password123  # Change this!
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data  # Local directory to persist data
    restart: always
